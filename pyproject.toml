[project]
name = "synth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "descript-audio-codec==1.0.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.10",
    "mido>=1.3.3",
    "numba>=0.61",
    "pedalboard>=0.9.24",
    "py7zr>=1.1.3",
    "pydantic>=2.13.4",
    "safetensors>=0.6",
    "scikit-learn>=1.9.0",
    "tensorboard>=2.20",
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synth", "webui"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
