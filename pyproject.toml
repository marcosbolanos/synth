[project]
name = "synth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mido>=1.3.3",
    "pedalboard>=0.9.24",
    "py7zr>=1.1.3",
    "pydantic>=2.13.4",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synth"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
